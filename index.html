<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>

<title>مغامرة النيل الذكية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d9488">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sky1:#7dd3fc;--sky2:#fde68a;--panel:#fffbeb;--ink:#0f3d5e;--gold:#f5b301;--turq:#0d9488;--lapis:#1e40af;--coral:#ef4444;--sand:#f6d58e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#0b1d4d;--sky2:#5b3a7a;--panel:#1c2a5a;--ink:#fff3c4}}
:root[data-theme="dark"]{--sky1:#0b1d4d;--sky2:#5b3a7a;--panel:#1c2a5a;--ink:#fff3c4}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;font-family:'Baloo Bhaijaan 2',Cairo,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;height:100%;background:linear-gradient(var(--sky1),var(--sky2));color:var(--ink);overflow:hidden;display:flex;flex-direction:column;position:relative}
button{cursor:pointer}
.band{height:10px;flex:none;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--turq) 14px 28px,var(--lapis) 28px 42px)}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:14px;right:8%;width:9vmin;height:9vmin;min-width:34px;min-height:34px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 8px #fde68a88,0 0 40px #f59e0b;animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.1)}}
.pyr{position:absolute;bottom:0;background:linear-gradient(135deg,#fcd34d,#d97706);clip-path:polygon(50% 0,100% 100%,0 100%)}
.p1{left:5%;width:36vmin;height:30vmin}.p2{left:27%;width:22vmin;height:17vmin;opacity:.85}.p3{right:3%;width:30vmin;height:24vmin;background:linear-gradient(135deg,#f59e0b,#b45309)}
#menu{position:absolute;inset:0;z-index:50;overflow:auto;display:flex;flex-direction:column;align-items:center;background:linear-gradient(var(--sky1),var(--sky2))}
.mw{position:relative;z-index:2;width:min(760px,100%);padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ttl{margin:4px 0 0;font-size:clamp(2rem,7vw,3.6rem);color:#fff;text-align:center;text-shadow:0 4px 0 var(--lapis),0 0 18px #f59e0b;line-height:1.2;animation:pl 4s ease-in-out infinite}
.tag{margin:0;font-size:1.15rem;font-weight:800;text-align:center}
.card{background:var(--panel);border:4px solid var(--gold);border-radius:24px;padding:10px 16px;width:100%;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.card h3{margin:0 0 6px;font-size:1.1rem}.card ol{margin:0;padding-inline-start:22px;font-weight:600;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.chip{border:3px solid var(--lapis);background:#fff;color:var(--lapis);border-radius:999px;padding:4px 16px;font-size:1.05rem;font-weight:800}
.chip.on{background:var(--lapis);color:#fff;box-shadow:0 0 0 3px var(--gold)}
.chip:focus-visible,.mb:focus-visible,.nb:focus-visible,#jump:focus-visible{outline:4px solid var(--coral);outline-offset:2px}
input{border:3px solid var(--turq);border-radius:14px;padding:4px 10px;font-size:1rem;width:150px;background:#fff;color:#0f3d5e}
.mb{border:0;border-radius:26px;padding:10px 22px;font-size:clamp(1.2rem,4.5vw,1.8rem);font-weight:800;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.25);transition:transform .15s}
.mb:hover{transform:translateY(-3px) rotate(-1.5deg)}.mb:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.m-add{background:#d99a00}.m-cmp{background:#16803c}.m-sub{background:#e11d74}.m-mul{background:var(--turq)}.m-div{background:var(--lapis)}
.spons{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;background:linear-gradient(90deg,var(--lapis),var(--turq));color:#fff;text-decoration:none;border-radius:20px;padding:8px 16px;font-weight:800;border:3px solid var(--gold);width:100%}
.spons b{background:var(--gold);color:#3b2a00;border-radius:999px;padding:0 14px}
#game{display:none;flex:1;min-height:0;flex-direction:column}
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;flex:none}
#sb{flex:1;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sq{width:46px;height:46px;border-radius:14px;border:3px solid var(--gold);background:#fff;font-size:1.5rem;box-shadow:0 4px 0 #ccc}
.pl{background:#fff;border:3px solid var(--lapis);border-radius:16px;padding:0 12px;font-weight:800;color:var(--lapis);display:flex;gap:6px;align-items:center}
.pl.act{background:var(--gold);color:#3b2a00;animation:pl 1s ease-in-out infinite;border-color:#b45309}
#tbar{height:20px;background:#0003;position:relative;display:none;flex:none}
#tfill{display:block;height:100%;width:100%;transition:width .1s linear}
#tnum{position:absolute;inset:0;text-align:center;font-weight:800;font-size:.85rem;line-height:20px;color:#fff;text-shadow:0 1px 2px #000}
#scene{flex:none;height:clamp(210px,44vh,430px);position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;background:linear-gradient(#bae6fd,#fde68a 65%,var(--sand));border-bottom:6px solid var(--gold)}
#scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#38bdf8 0 22px,#0ea5e9 22px 44px)}
#grid{position:relative;z-index:3;display:grid;background:#fffbeb88;border:3px solid var(--gold);border-radius:18px;padding:6px;margin-bottom:8px}
.sp{width:var(--s);height:calc(var(--s)*1.25);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.sp .e{font-size:calc(var(--s)*.62);line-height:calc(var(--s)*.7)}
.sp .n{font-size:calc(var(--s)*.4);font-weight:800;color:#fff;line-height:1.1;text-shadow:0 2px 0 #0f3d5e,0 0 5px #0f3d5e;border-radius:10px;padding:0 3px}
.sp.f .n{color:#ffe14d}.sp.v .n{background:#16a34a}
#hero{position:absolute;width:var(--s);height:var(--s);display:none;z-index:5;text-align:center;font-size:calc(var(--s)*.9);line-height:var(--s);transition:left .35s,top .35s;pointer-events:none}
#hero span{display:inline-block}.hop{animation:hop .35s}
@keyframes hop{50%{transform:translateY(-55%) scale(1.25) rotate(-8deg)}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#mid{flex:none;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;background:var(--panel);border-bottom:4px dashed var(--gold)}
#hint{font-weight:800;font-size:clamp(1rem,3.4vw,1.4rem);text-align:center}
#jump{border:0;border-radius:40px;padding:6px 34px;font-size:clamp(1.3rem,4vw,2rem);font-weight:800;background:var(--gold);color:#3b2a00;box-shadow:0 6px 0 #b45309;visibility:hidden}
#jump:active{transform:translateY(4px);box-shadow:0 2px 0 #b45309}
#work{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 26px;padding:8px 10px;background:var(--panel);overflow:auto}
#teacher{display:flex;flex-direction:column;align-items:center;width:190px}
#av{font-size:3.4rem;line-height:1}#av.talk{animation:hop .5s 3}
#bub{background:#fff;color:#0f3d5e;border:3px solid var(--gold);border-radius:16px;padding:4px 10px;font-weight:700;font-size:.95rem;text-align:center;min-height:2.6em}
#eq{display:flex;align-items:center;gap:clamp(6px,1.6vw,16px);font-size:clamp(2.4rem,9vw,5.5rem);font-weight:800;color:var(--lapis)}
#ans{min-width:1.7em;padding:0 .2em;height:1.5em;border:.12em solid var(--lapis);border-radius:.3em;display:flex;align-items:center;justify-content:center;background:#f4f4f4}
#ans.ok{color:#16a34a;border-color:#16a34a}#ans.bad{color:var(--coral);border-color:var(--coral)}
#pad{display:grid;grid-template-columns:repeat(3,clamp(54px,9vh,76px));gap:8px;background:#90a4ae;padding:12px;border-radius:24px}
.nb{height:clamp(44px,8vh,64px);font-size:1.8rem;font-weight:800;border:0;border-radius:14px;background:#fff;color:var(--lapis);box-shadow:0 5px 0 #546e7a}
.nb:active{transform:translateY(3px);box-shadow:0 2px 0 #546e7a}
#win{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;overflow:auto;background:rgba(10,30,80,.94);color:#fff;text-align:center}
#win h1{margin:0;font-size:clamp(2rem,7vw,3.6rem);color:var(--gold)}
.st{display:grid;grid-template-columns:auto auto;gap:6px 24px;background:#ffffff1a;border:3px solid var(--gold);border-radius:24px;padding:14px 24px;font-size:1.3rem;font-weight:700}
.st b{color:var(--gold);font-size:1.6rem}
.cf{position:fixed;top:-30px;font-size:26px;z-index:999;pointer-events:none;animation:fall 2.3s linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.arc{position:absolute;border:4px dashed #fff;border-bottom:0;border-radius:50% 50% 0 0;pointer-events:none;z-index:4}
#dk{position:absolute;top:4px;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(1.4rem,5vw,2.4rem);pointer-events:none;animation:pl 4s ease-in-out infinite;white-space:pre}
#scene[data-e="1"]{background:linear-gradient(#a7f3d0,#4ade80 70%,#15803d)}
#scene[data-e="2"]{background:linear-gradient(#67e8f9,#0891b2 60%,#164e63)}
#scene[data-e="3"]{background:linear-gradient(#0b1d4d,#4c1d95 70%,#7c3aed)}
#scene:not([data-e="0"]) .pyr,#scene:not([data-e="0"]) .sun{display:none}
#hero.bf span{animation:idle .9s ease-in-out infinite}#hero.bf span.hop{animation:hopf .5s}
@keyframes idle{50%{transform:scaleX(.55)}}@keyframes hopf{30%{transform:translateY(-70%) scaleX(.5)}60%{transform:translateY(-55%) scaleX(1.1)}}
.sp.h{background:#fff8;border-radius:12px;animation:pl 1s infinite}
#race{display:none;flex:none;padding:3px 10px;gap:3px;flex-direction:column;background:#0369a1}
.ln{position:relative;height:24px;background:repeating-linear-gradient(90deg,#38bdf8 0 22px,#0ea5e9 22px 44px);border-radius:12px;overflow:hidden}
.bt{position:absolute;top:-1px;left:0;font-size:1.3rem;transition:left .6s}.ln::after{content:'🏁';position:absolute;right:4px;top:0}
#turn{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;pointer-events:none}
#turn b{background:var(--gold);color:#3b2a00;border:5px solid #b45309;border-radius:30px;padding:8px 36px;font-size:clamp(2rem,8vw,4rem);animation:pop .9s forwards}
@keyframes pop{0%{transform:scale(.2)}30%{transform:scale(1.1)}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.cb{font-size:2.4rem}
#rest{position:absolute;inset:0;z-index:55;overflow:auto;display:none;flex-direction:column;align-items:center;background:linear-gradient(var(--sky1),var(--sky2))}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;width:100%}
.rc{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel);border:4px solid var(--c);border-radius:22px;padding:14px;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .15s}
.rc:hover{transform:translateY(-4px) rotate(-1deg)}.rc i{font-style:normal;font-size:2.6rem;background:var(--c);width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center}.rc b{font-size:1.3rem}.rc small{font-weight:600;text-align:center}
.rh{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font-weight:800;font-size:1.1rem}
.ar{position:relative;flex:1;min-height:300px;width:100%;overflow:hidden;border:4px solid var(--gold);border-radius:22px;background:linear-gradient(#bae6fd,#fde68a);touch-action:none;margin-top:8px}
.gr{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}
.ho{border:0;border-radius:50%;background:radial-gradient(#6b4423,#3b2412);font-size:clamp(2rem,9vw,3.4rem);box-shadow:inset 0 8px 0 #0004}
.fl{position:absolute;font-size:2rem;font-style:normal;transform:translateX(-50%)}
#bk{position:absolute;bottom:6px;font-size:3rem;transform:translateX(-50%)}
.bu{position:absolute;border:3px solid #fff8;border-radius:50%;font-size:1.4rem;padding:0}
.ro{position:absolute;inset:0;background:#0a1e50e6;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:9}
.cg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px}
.cd{border:0;border-radius:16px;background:var(--lapis);color:#fff;font-size:clamp(1.6rem,7vw,3rem)}.cd.on{background:#fff}.cd.ok{background:#bbf7d0}
#cur{position:absolute;inset:0;z-index:56;overflow:auto;display:none;flex-direction:column;align-items:center;background:linear-gradient(var(--sky1),var(--sky2))}
.cv{font-size:clamp(1.6rem,6vw,2.6rem);text-align:center;line-height:1.5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 4px;font-weight:800;color:var(--lapis)}.cv small{font-size:.9rem;color:var(--ink)}
.tb{border:0;background:transparent;font-size:clamp(1.6rem,6vw,2.6rem);padding:2px;border-radius:12px}.tb:active{background:var(--gold)}
.opt{border:4px solid var(--lapis);background:#fff;color:var(--lapis);border-radius:20px;padding:8px 18px;font-size:clamp(1.2rem,4.5vw,2rem);font-weight:800;box-shadow:0 5px 0 #0003;min-width:110px}.opt:active{transform:translateY(3px)}
.cin{min-width:2.2em;height:1.6em;border:5px solid var(--lapis);border-radius:16px;background:#f4f4f4;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:800;color:var(--lapis);padding:0 10px}
.pd{display:grid;grid-template-columns:repeat(3,clamp(54px,9vh,76px));gap:8px;background:#90a4ae;padding:10px;border-radius:22px;margin:0 auto}
.cbub{background:#fff;color:#0f3d5e;border:3px solid var(--gold);border-radius:16px;padding:4px 12px;font-weight:700;min-width:180px;min-height:2.4em}.av.talk{animation:hop .5s 3}
.bar{height:20px;border-radius:10px;margin:6px 0}
.col{display:flex;flex-direction:column-reverse;align-items:center;font-size:1.25rem;line-height:1.05;min-width:34px}
.nl{display:flex;border-bottom:3px solid var(--ink);padding-bottom:2px}.tk{width:clamp(13px,4vw,30px);display:flex;flex-direction:column;align-items:center}
.tk i{width:2px;height:12px;background:var(--ink)}.tk span{height:1.7rem;font-size:1.4rem;line-height:1.7rem;white-space:nowrap}.tk small{font-size:.75rem;height:1rem;font-weight:700}
#par{position:absolute;inset:0;z-index:57;overflow:auto;display:none;flex-direction:column;align-items:center;background:linear-gradient(var(--sky1),var(--sky2))}
.bw{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700}.bw span{width:38%;font-size:.95rem}.bw small{width:84px;font-size:.8rem}
.bb2{flex:1;height:20px;background:#0002;border-radius:10px;overflow:hidden}.bb2 i{display:block;height:100%;border-radius:10px}
.cal{display:grid;grid-template-columns:repeat(7,clamp(34px,10vw,52px));gap:3px;font-weight:800}.cal b{background:#fecaca;border-radius:6px;text-align:center;padding:3px 0}.cal small{text-align:center;font-size:.7rem}
#pay{position:absolute;inset:0;z-index:58;overflow:auto;display:none;flex-direction:column;align-items:center;background:linear-gradient(var(--sky1),var(--sky2))}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="menu"></div>
<div id="game">
  <div class="band"></div>
  <div id="top"><button class="sq" id="home" aria-label="home">🏠</button><div id="sb"></div><button class="sq" id="snd" aria-label="sound">🔊</button></div>
  <div id="tbar"><i id="tfill"></i><span id="tnum"></span></div>
  <div id="race" dir="ltr"><div class="ln"><span class="bt" id="b0">⛵</span></div><div class="ln"><span class="bt" id="b1">🚤</span></div></div>
  <section id="scene" data-e="0"><div id="dk"></div><div class="sun"></div><b class="pyr p1"></b><b class="pyr p2"></b><b class="pyr p3"></b><div id="grid" dir="ltr"></div></section>
  <div id="mid"><div id="hint"></div><button id="jump"></button></div>
  <section id="work">
    <div id="teacher"><div id="av" class="av">👩‍🏫</div><div id="bub" class="bb"></div></div>
    <div id="eq" dir="ltr"></div>
    <div id="pad" dir="ltr"></div>
  </section>
</div>
<div id="pay"></div>
<div id="par"></div>
<div id="cur"></div>
<div id="rest"></div>
<div id="turn"><b></b></div>
<div id="win"></div>

<script>
/* ===== إعدادات العلامة التجارية (عدّلها لعميلك) ===== */
const BRAND={url:"#",logo:"🏺",
 ar:{name:"أكاديمية النيل للرياضيات",tag:"احجز حصة تجريبية مجانية لطفلك",cta:"سجّل الآن"},
 en:{name:"Nile Math Academy",tag:"Book a free trial class for your child",cta:"Sign up"}};
/* ضع هنا روابط ملفات صوت المعلمة (mp3) لو سجّلتها؛ لو تُركت فارغة يُستخدم صوت المتصفح */
const VOICE={ok:[],no:[],time:[],win:[],start:[]};

const T={
ar:{title:"مغامرة النيل الذكية",tag:"العب وتعلّم الحساب مع أصحابك!",
 how:["اختر الرقم الأول على خط الأعداد.","اضغط «اقفز» وعُدّ الخطوات.","اكتب الإجابة على لوحة الأرقام."],
 mode:{add:"🐸 جمع",sub:"🦋 طرح",mul:"🐰 ضرب",div:"🐿️ قسمة",cmp:"🐊 أكبر وأصغر"},chal:"🔥 تحدّي إضافي (للمتفوقين)",env:["مصر 🔺","الغابة 🌲","البحر 🌊","الفضاء 🚀"],lvT:"المستوى",lv:["سهل (حتى ١٠)","متوسط (حتى ٣٠)","صعب (حتى ٥٠)"],
 plT:"اللاعبون",pl:["لاعب واحد","تحدّي لاعبين 🤝"],timer:"⏱️ مؤقت ٣٠ ثانية",nm:["سلمى","يوسف"],choose:"اختر العملية وابدأ:",
 jump:"اقفز!",q:"سؤال",turn:n=>`دورك يا ${n}!`,
 h:{pick:n=>`اضغط على الرقم ${n} 👆`,add:(a,b)=>`اقفز ${b} للأمام ➡️`,sub:(a,b)=>`اقفز ${b} للخلف ⬅️`,mul:(a,b)=>`اقفز ${b} مرات، كل قفزة ${a} ➡️`,div:(a,b)=>`اقفز للخلف ${b} في كل مرة حتى الصفر وعُدّ القفزات ⬅️`,edge:"لا يمكن القفز أكثر من كده!",fw:"للأمام ➡️",bw:"للخلف ⬅️",k1:(d,f,t)=>`اقفز ${d} من ${f} إلى ${t} وعُدّ القفزات`,k2:(d,n)=>`اقفز ${n} ${d} واكتب الرقم الذي وصلت إليه`,cmp:"قارن بين الطرفين واختر الإشارة الصحيحة 🐊"},

 en:{title:"Unlock all levels 🔓",sub:"Enter the activation code you received on WhatsApp",ph:"NILE-XXXX-XXXX",go:"Activate",wa:"Get a code on WhatsApp",back:"Back",invalid:"Invalid code",used:"This code has already been used",many:"Too many attempts, try again in 10 minutes",err:"Connection failed, try again later",anon:"Could not start a session. Enable “Allow anonymous sign-ins” in Supabase",ok:d=>`Activated until ${d} 🎉`,prem:d=>`👑 Active until ${d}`,free:"Free version — some levels are locked",unlock:"🔓 Enter code",msg:"Hello, I'd like an activation code for Nile Math Adventure"}};
const fdate=d=>new Date(d).toLocaleDateString(lang=='ar'?'ar-EG':'en-GB');
function entCard(){if(!CL)return'';const t=PYT[lang];
 return `<div class="card"><div class="row"><b>${isPrem()?t.prem(fdate(ENT)):t.free}</b>${isPrem()?'':`<button class="chip on" onclick="showPay()">${t.unlock}</button>`}</div></div>`}
function showPay(){const t=PYT[lang],r=$('#pay'),P=window.PAY||{};['menu','game','win','rest','cur','par'].forEach(x=>$('#'+x).style.display='none');r.style.display='flex';
 const wa=/^\d{8,15}$/.test(P.wa||'')?`<a class="chip on" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${P.wa}?text=${encodeURIComponent(t.msg)}">💬 ${t.wa}</a>`:'';
 r.innerHTML=`<div class="mw"><h1 class="ttl">👑</h1><div class="card" style="text-align:center"><h3>${t.title}</h3><p style="font-weight:700">${t.sub}</p>${P.price?`<p style="font-weight:800">${esc(P.price)}${P.how?' — '+esc(P.how):''}</p>`:''}<input id="pc" placeholder="${t.ph}" maxlength="20" autocomplete="off" style="width:230px;text-align:center;font-size:1.2rem;text-transform:uppercase"><p id="pm" style="color:#ef4444;font-weight:700;min-height:1.4em;margin:6px 0"></p><div class="row"><button class="chip on" onclick="redeem()">${t.go}</button>${wa}<button class="chip" onclick="menu()">${t.back}</button></div></div></div>`}
async function ensureSession(){if(SES)return true;const r=await CL.auth.signInAnonymously();if(r.error||!r.data||!r.data.session)return false;SES=r.data.session;return true}
async function loadEnt(){if(!CL||!SES)return;try{const r=await CL.from('entitlements').select('premium_until').eq('user_id',SES.user.id).maybeSingle();ENT=r.data?r.data.premium_until:null;try{ENT?localStorage.setItem('nm_ent',ENT):localStorage.removeItem('nm_ent')}catch(e){}}catch(e){}}
async function redeem(){const t=PYT[lang],m=$('#pm'),c=$('#pc').value;if(!c.trim())return;m.style.color='#ef4444';m.textContent='…';
 try{if(!await ensureSession()){m.textContent=t.anon;return}
  const r=await CL.rpc('redeem_voucher',{p_code:c});if(r.error){m.textContent=t.err;return}const d=r.data||{};
  if(!d.ok){m.textContent=d.error=='used'?t.used:d.error=='too_many'?t.many:t.invalid;return}
  ENT=d.premium_until;try{localStorage.setItem('nm_ent',ENT)}catch(e){}
  m.style.color='#16a34a';m.textContent=t.ok(fdate(ENT));if(DB.parent)cloudSave();setTimeout(menu,1500)}catch(e){m.textContent=t.err}}
const PT={ar:{who:"من يلعب؟",add:"➕ طفل جديد",guest:"ضيف (بدون حفظ)",save:"حفظ",ph:"اسم الطفل",par:"👨‍👩‍👧 لوحة ولي الأمر",auto:"🤖 ذكي (يتكيّف)",pin:"أدخل الرقم السري",setpin:"أنشئ رقماً سرياً لولي الأمر (4 أرقام)",bad:"أدخل 4 أرقام صحيحة",ok:"دخول",strong:"💪 نقاط القوة",weak:"🎯 تحتاج تدريباً",acc:"الدقة",avg:"متوسط الزمن",qs:"الأسئلة",del:"حذف بيانات الطفل",delc:"اضغط مرة أخرى للتأكيد",nodata:"لا توجد بيانات بعد — دع الطفل يلعب أولاً",wk:"📅 الاختبارات الأسبوعية",lv:["مبتدئ 🌱","متوسط 🌿","متقدم 🌳"],note:"التقدم محفوظ على هذا الجهاز وهذا المتصفح فقط",pname:"اسم ولي الأمر",create:"إنشاء حساب ولي الأمر",nick:"لقب أو رمز للطفل (وليس اسمه الحقيقي)",acct:"حساب ولي الأمر",priv:"كل البيانات محفوظة باسم ولي الأمر فقط، والأطفال بألقاب ورموز بلا أسماء حقيقية",kidn:"طفل",delall:"حذف الحساب وكل البيانات",need:"أدخل اسم ولي الأمر ورقماً سرياً من 4 أرقام"},
 en:{who:"Who's playing?",add:"➕ New child",guest:"Guest (no saving)",save:"Save",ph:"Child's name",par:"👨‍👩‍👧 Parent dashboard",auto:"🤖 Smart (adaptive)",pin:"Enter the PIN",setpin:"Create a parent PIN (4 digits)",bad:"Enter 4 valid digits",ok:"Enter",strong:"💪 Strengths",weak:"🎯 Needs practice",acc:"Accuracy",avg:"Avg. time",qs:"Questions",del:"Delete child's data",delc:"Tap again to confirm",nodata:"No data yet — let the child play first",wk:"📅 Weekly tests",lv:["Beginner 🌱","Medium 🌿","Advanced 🌳"],note:"Progress is saved on this device and browser only",pname:"Parent name",create:"Create parent account",nick:"Nickname or symbol for the child (not their real name)",acct:"Parent account",priv:"All data is kept under the parent's name only; children use nicknames and avatars, never real names",kidn:"Child",delall:"Delete account and all data",need:"Enter the parent name and a 4-digit PIN"}};
function profCard(){const p=PT[lang],K=kid();
 if(!DB.parent)return `<div class="card"><h3>👨‍👩‍👧 ${p.acct}</h3><div class="row"><input id="pa" maxlength="20" placeholder="${p.pname}"><input id="pp" type="password" inputmode="numeric" maxlength="4" placeholder="PIN" style="width:90px;text-align:center"></div><p id="pe" style="color:#ef4444;font-weight:700;margin:6px 0;min-height:1.2em"></p><div class="row"><button class="chip on" onclick="mkPar()">${p.create}</button></div><small style="font-weight:700">${p.priv}</small></div>`;
 return `<div class="card"><h3>👨‍👩‍👧 ${esc(DB.parent)}</h3><div class="row">${DB.kids.map(k=>ch(k.id==DB.cur,`pickKid('${k.id}')`,`${k.av} ${esc(k.name)}`)).join('')}${ch(!DB.cur,"pickKid('')",p.guest)}${ch(0,"S.add=1;menu()",p.add)}</div>
 ${S.add?`<div class="row" style="margin-top:8px"><input id="kn" maxlength="14" placeholder="${p.nick}" value="${esc(S.nm||'')}">${['🦊','🐰','🐸','🦋','🐱','🦁'].map(a=>ch((S.av||'🦊')==a,`S.nm=$('#kn').value;S.av='${a}';menu()`,a)).join('')}<button class="chip on" onclick="addKid()">${p.save}</button></div>`:''}
 <div class="row" style="margin-top:8px">${K?`<b>⭐ ${K.pts}</b>`:''}<button class="chip" onclick="openPar()">${p.par}</button></div></div>`}
function mkPar(){const n=$('#pa').value.trim(),v=$('#pp').value;if(!n||!/^\d{4}$/.test(v)){$('#pe').textContent=PT[lang].need;return}DB.parent=n;DB.pin=v;save();menu()}
function pickKid(id){DB.cur=id||null;save();menu()}
function addKid(){const n=$('#kn').value.trim()||(PT[lang].kidn+' '+(DB.kids.length+1));const k={id:'k'+Date.now(),name:n,av:S.av||'🦊',pts:0,lv:{},st:{}};DB.kids.push(k);DB.cur=k.id;S.add=0;S.nm='';save();menu()}
function openPar(){if(!DB.parent){menu();return}const p=PT[lang],r=$('#par');['menu','game','win','rest','cur'].forEach(x=>$('#'+x).style.display='none');r.style.display='flex';
 r.innerHTML=`<div class="mw"><h1 class="ttl">👨‍👩‍👧</h1><div class="card" style="text-align:center"><p style="font-weight:800">${DB.pin?p.pin:p.setpin}</p><input id="pn" type="password" inputmode="numeric" maxlength="4" style="width:120px;text-align:center;font-size:1.4rem"><p id="pe" style="color:#ef4444;font-weight:700;min-height:1.4em"></p><div class="row"><button class="chip on" onclick="pinGo()">${p.ok}</button><button class="chip" onclick="menu()">🏠 ${L().home}</button></div></div></div>`}
function pinGo(){const v=$('#pn').value,f=()=>dash(DB.cur||(DB.kids[0]&&DB.kids[0].id));if(!/^\d{4}$/.test(v)){$('#pe').textContent=PT[lang].bad;return}
 if(!DB.pin){DB.pin=v;save();f()}else if(DB.pin==v)f();else $('#pe').textContent=PT[lang].bad}
function dash(id){const p=PT[lang],l=CT[lang],K=DB.kids.find(k=>k.id==id),r=$('#par'),nm=k=>l.t[k]?l.t[k][0]:L().mode[k];let body=`<p style="text-align:center;font-weight:700">${p.nodata}</p>`;
 if(K){const rows=Object.keys(K.st).filter(k=>K.st[k].t>0).map(k=>{const s=K.st[k];return{k,t:s.t,a:Math.round(s.ok/s.t*100),m:Math.round(s.ms/s.t/1000),lv:K.lv[k]||0}}).sort((a,b)=>b.a-a.a);
  if(rows.length){const tq=rows.reduce((x,y)=>x+y.t,0),ta=Math.round(rows.reduce((x,y)=>x+y.a*y.t,0)/tq),good=rows.filter(x=>x.a>=80&&x.t>=4).slice(0,3);
   let weak=rows.filter(x=>x.a<70&&x.t>=4).slice(-3);if(!weak.length&&rows.length>1&&rows[rows.length-1].a<90)weak=[rows[rows.length-1]];
   const li=a=>a.length?a.map(x=>`<li>${nm(x.k)} (${x.a}%)</li>`).join(''):'<li>—</li>',col=a=>a>=80?'#16a34a':a>=60?'#f59e0b':'#ef4444';
   body=`<div class="row" style="font-weight:800"><span>⭐ ${K.pts}</span><span>${p.qs}: ${tq}</span><span>${p.acc}: ${ta}%</span></div>`+
   rows.map(x=>`<div class="bw"><span>${nm(x.k)}</span><div class="bb2"><i style="width:${x.a}%;background:${col(x.a)}"></i></div><b>${x.a}%</b><small>${p.lv[x.lv]}</small></div>`).join('')+
   `<div class="row" style="align-items:flex-start;margin-top:8px"><div class="card" style="width:46%"><h3>${p.strong}</h3><ul style="margin:0;padding-inline-start:18px">${li(good)}</ul></div><div class="card" style="width:46%"><h3>${p.weak}</h3><ul style="margin:0;padding-inline-start:18px">${li(weak)}</ul></div></div>`}}
 r.innerHTML=`<div class="mw"><h1 class="ttl">👨‍👩‍👧 ${esc(DB.parent)}</h1><div class="row">${DB.kids.map(k=>ch(k.id==id,`dash('${k.id}')`,`${k.av} ${esc(k.name)}`)).join('')}</div><div class="card">${body}</div>${wkHtml(K)}
 <small style="font-weight:700;text-align:center">${p.note}<br>${p.priv}</small><p style="color:#ef4444;font-weight:700;text-align:center;margin:4px 0">${S.derr||''}</p><div class="row">${K?`<button class="chip" onclick="delK('${K.id}')">${S.dk==K.id?p.delc:p.del}</button>`:''}<button class="chip" onclick="delAll()">${S.da?p.delc:p.delall}</button><button class="chip on" onclick="menu()">🏠 ${L().home}</button></div></div>`}
function wkHtml(K){const p=PT[lang];if(!K||!K.wk||!K.wk.length)return'';
 return `<div class="card" style="margin-top:8px"><h3>${p.wk}</h3>${K.wk.slice(-6).reverse().map(w=>{const a=Math.round(w.ok/w.n*100);return `<div class="bw"><span>${new Date(w.d).toLocaleDateString(lang=='ar'?'ar-EG':'en-GB')}</span><div class="bb2"><i style="width:${a}%;background:${a>=80?'#16a34a':a>=60?'#f59e0b':'#ef4444'}"></i></div><b>${w.ok}/${w.n}</b><small>⏱ ${Math.floor(w.t/60)}:${String(w.t%60).padStart(2,'0')}</small></div>`}).join('')}</div>`}
async function delAll(){if(!S.da){S.da=1;S.derr='';dash(DB.cur||(DB.kids[0]&&DB.kids[0].id));return}
 if(CL&&SES){try{const r=await CL.rpc('delete_my_account');if(r.error){S.derr=r.error.message;S.da=0;dash(DB.cur||(DB.kids[0]&&DB.kids[0].id));return}await CL.auth.signOut()}catch(e){S.derr=String(e.message||e);S.da=0;dash(DB.cur||(DB.kids[0]&&DB.kids[0].id));return}SES=null}
 ENT=null;try{localStorage.removeItem('nm_ent')}catch(e){}clearTimeout(syncT);DB={kids:[],cur:null,pin:'',parent:''};S.da=0;S.derr='';try{localStorage.removeItem(SK)}catch(e){}menu()}
function delK(id){if(S.dk!=id){S.dk=id;dash(id);return}DB.kids=DB.kids.filter(k=>k.id!=id);if(DB.cur==id)DB.cur=null;S.dk=0;save();dash(DB.kids[0]&&DB.kids[0].id)}
